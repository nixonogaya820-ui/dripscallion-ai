<style>
.chat-image-card{margin-top:12px;max-width:100%}
.chat-image-card img{display:block;width:100%;max-width:560px;border-radius:12px;border:1px solid #343c59}
.chat-image-card a{display:inline-block;margin-top:9px;color:#c6baff;text-decoration:none;font-size:12px}
</style>
<script>
/* DRIPSCALLION AI — CHAT IMAGE GENERATION ADD-ON */
async function getCreationById(id){
  const db=await openCreationDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(CREATION_STORE,"readonly");
    const req=tx.objectStore(CREATION_STORE).get(id);
    req.onsuccess=()=>{db.close();resolve(req.result||null)};
    req.onerror=()=>{db.close();reject(req.error)};
  });
}

function extractImagePrompt(text){
  const value=String(text||"").trim();
  const patterns=[
    /^(?:please\s+)?(?:generate|create|make|draw|design|render)\s+(?:me\s+)?(?:an?\s+)?(?:image|picture|photo|artwork)\s+(?:of\s+)?(.+)$/i,
    /^(?:tengeneza|nitengenezee|chora|nichoree|unda|nionyeshe)\s+(?:picha|image|photo)\s+(?:ya|wa|la|cha)?\s*(.+)$/i,
    /^(?:naomba)\s+(?:picha|image)\s+(?:ya|wa|la|cha)\s+(.+)$/i
  ];
  for(const pattern of patterns){
    const match=value.match(pattern);
    if(match&&match[1]?.trim())return match[1].trim();
  }
  return null;
}

async function generateChatImage(prompt,chat){
  const data=await postJSON("/api/image",{prompt,steps:8});
  const image=data.image||data.dataURI;
  if(!image||!String(image).startsWith("data:image/")){
    throw new Error("Image service did not return a valid image.");
  }
  const id=makeId();
  const filename=`dripscallion-${Date.now()}.jpg`;
  await saveCreation({
    id,
    ownerId:currentUser?.id||"guest",
    prompt,
    image,
    filename,
    createdAt:Date.now()
  });
  chat.messages.push({
    role:"assistant",
    content:"Your image is ready.",
    imageId:id,
    imagePrompt:prompt
  });
  await saveChat(chat);
}

const originalRenderMessages=renderMessages;
renderMessages=function(){
  originalRenderMessages();
  const chat=getCurrentChat();
  if(!chat)return;
  const rows=$("messages").querySelectorAll(".message.assistant");
  const imageMessages=chat.messages.filter(m=>m.role==="assistant"&&m.imageId);
  imageMessages.forEach(async(message,index)=>{
    const row=rows[index];
    if(!row||row.dataset.imageLoaded==="yes")return;
    row.dataset.imageLoaded="yes";
    try{
      const item=await getCreationById(message.imageId);
      if(!item||!row.isConnected)return;
      const card=document.createElement("div");
      card.className="chat-image-card";
      const img=document.createElement("img");
      img.src=item.image;
      img.alt=item.prompt||"Generated image";
      const link=document.createElement("a");
      link.href=item.image;
      link.download=item.filename||"dripscallion-image.jpg";
      link.textContent="Download image";
      card.append(img,link);
      const bubble=row.querySelector(".bubble");
      const tools=bubble?.querySelector(".message-tools");
      if(tools)bubble.insertBefore(card,tools);
      else bubble.appendChild(card);
    }catch(error){
      console.error("Could not display saved chat image:",error);
    }
  });
};

const originalSendMessage=sendMessage;
sendMessage=async function(){
  if(isSending)return;
  const text=$("messageInput").value.trim();
  const files=[...pendingFiles];
  const prompt=files.length?null:extractImagePrompt(text);
  if(!prompt){
    return originalSendMessage();
  }
  if(!text)return;

  let chat=getCurrentChat();
  if(!chat){
    chat={
      id:makeId(),
      title:makeTitle(text),
      messages:[],
      created_at:new Date().toISOString(),
      updated_at:new Date().toISOString()
    };
    chats.unshift(chat);
    currentChatId=chat.id;
  }

  chat.messages.push({role:"user",content:text});
  if(chat.messages.length===1)chat.title=makeTitle(text);
  $("messageInput").value="";
  $("messageInput").style.height="auto";
  renderChatList();
  renderMessages();
  rememberActiveChat();
  await saveChat(chat);

  isSending=true;
  $("sendButton").disabled=true;
  $("sendButton").textContent="…";
  const typing=document.createElement("div");
  typing.className="typing";
  typing.textContent="Creating your image...";
  $("messages").appendChild(typing);
  scrollToBottom();

  try{
    await generateChatImage(prompt,chat);
  }catch(error){
    console.error("Chat image generation failed:",error);
    chat.messages.push({
      role:"assistant",
      content:"Image generation failed: "+error.message
    });
    await saveChat(chat);
  }finally{
    isSending=false;
    $("sendButton").disabled=false;
    $("sendButton").textContent="↑";
    renderChatList();
    renderMessages();
  }
};

console.log("DRIPSCALLION AI chat image generation enabled.");
</script>
