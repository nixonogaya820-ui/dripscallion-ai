
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRIPSCALLION AI</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#11172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DRIPSCALLION AI">
<style>
:root{
 --bg:#080b18;
 --panel:#101429;
 --panel2:#171c35;
 --border:#282e4b;
 --purple:#9b7cff;
 --purple2:#7654d9;
 --text:#f4f2ff;
 --muted:#969bb5;
}
*{box-sizing:border-box}
body{
 margin:0;background:
 radial-gradient(ellipse at 75% 0%,#24174b 0%,transparent 42%),
 radial-gradient(ellipse at 10% 90%,#171a3a 0%,transparent 40%),
 var(--bg);
 color:var(--text);font-family:Arial,sans-serif;
 height:100vh;overflow:hidden
}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{height:100vh;display:flex}

/* SIDEBAR */
.sidebar{
 width:270px;flex-shrink:0;background:rgba(12,15,32,.96);
 border-right:1px solid var(--border);
 display:flex;flex-direction:column;padding:15px;
 z-index:5
}
.brand{font-size:19px;font-weight:800;padding:10px 5px 22px}
.brand span{color:var(--purple)}
.newchat{
 width:100%;padding:12px;border-radius:10px;
 color:white;background:linear-gradient(110deg,#7654d9,#4e397e);
 border:0;text-align:left;margin-bottom:12px
}
.search{
 width:100%;padding:11px;border-radius:9px;
 color:white;background:#171b30;border:1px solid var(--border);
 outline:none;margin-bottom:15px
}
.section-label{
 color:var(--muted);font-size:11px;
 letter-spacing:1px;padding:4px 5px 10px
}
.history{flex:1;min-height:0;overflow-y:auto}
.chat-row{
 display:flex;align-items:center;gap:5px;
 border-radius:9px;margin-bottom:4px;padding:3px 5px
}
.chat-row:hover,.chat-row.active{background:#222641}
.chat-open{
 min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;
 white-space:nowrap;text-align:left;background:none;border:0;
 padding:9px 5px;color:#e5e2f3;font-size:13px
}
.chat-options{
 color:#aaa;background:none;border:0;padding:7px;
 border-radius:6px
}
.chat-options:hover{background:#353958}
.side-footer{
 border-top:1px solid var(--border);padding:14px 5px 3px;
 color:var(--muted);font-size:12px
}

/* MAIN */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
 height:60px;flex-shrink:0;display:flex;align-items:center;
 justify-content:space-between;padding:0 20px;
 border-bottom:1px solid rgba(50,55,88,.65);
 background:rgba(9,12,26,.45);backdrop-filter:blur(12px)
}
.top-left,.top-right{display:flex;align-items:center;gap:10px}
.icon-btn{
 border:1px solid var(--border);background:#171b30;
 color:#e8e5f5;border-radius:9px;padding:8px 11px
}
.top-title{font-weight:700;font-size:14px}
.mode{
 background:#171b30;color:white;border:1px solid var(--border);
 padding:9px;border-radius:9px;max-width:165px
}

/* CHAT AREA */
.content{flex:1;overflow-y:auto;padding:30px 20px}
.welcome{max-width:750px;margin:9vh auto 0;text-align:center}
.welcome h1{font-size:35px;margin:0 0 12px}
.welcome h1 span{color:var(--purple)}
.welcome p{color:var(--muted);line-height:1.7}
.suggestions{
 display:grid;grid-template-columns:repeat(2,1fr);
 gap:12px;margin-top:30px
}
.suggestion{
 background:rgba(25,29,54,.8);color:#eee;
 border:1px solid var(--border);border-radius:13px;
 padding:17px;text-align:left;line-height:1.5
}
.suggestion:hover{border-color:var(--purple)}
.messages{
 max-width:850px;margin:auto;display:flex;
 flex-direction:column;gap:26px
}
.message{display:flex;width:100%;gap:12px;align-items:flex-start}
.message.user{justify-content:flex-end}
.message.assistant{justify-content:flex-start}
.avatar{
 width:32px;height:32px;border-radius:50%;
 flex-shrink:0;display:flex;align-items:center;
 justify-content:center;font-size:10px;font-weight:bold;
 background:#302653;border:1px solid #51407f
}
.message.user .avatar{background:#343951;border-color:#4c5372}
.bubble{
 max-width:min(80%,700px);padding:12px 15px;
 line-height:1.75;overflow-wrap:anywhere;
 border-radius:16px;font-size:15px
}
.user .bubble{
 background:linear-gradient(130deg,#513d83,#392b62);
 border:1px solid #7256b5;border-top-right-radius:4px
}
.assistant .bubble{
 background:rgba(20,24,44,.88);
 border:1px solid #303653;border-top-left-radius:4px
}
.bubble p{margin:0 0 10px}
.bubble p:last-child{margin-bottom:0}
.bubble pre{
 overflow-x:auto;background:#090d1c;padding:13px;
 border-radius:9px;white-space:pre-wrap
}
.bubble code{background:#292344;padding:2px 5px;border-radius:4px}
.bubble ul,.bubble ol{padding-left:23px}
.msg-actions{display:flex;gap:7px;margin-top:10px}
.msg-actions button{
 background:transparent;color:#9da2ba;border:1px solid #343a55;
 padding:5px 9px;border-radius:7px;font-size:11px
}
.msg-actions button:hover{color:white;border-color:var(--purple)}
.typing{color:var(--muted);font-size:13px}

/* COMPOSER */
.composer-area{
 flex-shrink:0;padding:12px 18px 17px;
 background:linear-gradient(transparent,rgba(8,11,24,.9))
}
.composer{
 max-width:850px;margin:auto;background:rgba(24,28,51,.96);
 border:1px solid #424365;border-radius:17px;
 display:flex;align-items:flex-end;gap:8px;padding:10px
}
.composer:focus-within{border-color:var(--purple)}
.composer textarea{
 flex:1;min-width:0;resize:none;max-height:160px;
 min-height:28px;background:transparent;border:0;
 outline:none;color:white;padding:9px 4px;line-height:1.6
}
.circle{
 width:39px;height:39px;flex-shrink:0;border-radius:50%;
 border:1px solid #414560;background:#272b46;color:white
}
.send{
 background:var(--purple);color:#130d25;
 border:0;font-weight:bold
}
.send:disabled{opacity:.4;cursor:not-allowed}
.note{
 text-align:center;color:#737991;font-size:11px;
 margin-top:9px
}
.status{
 max-width:850px;margin:5px auto 0;
 color:#b6a5ff;font-size:12px
}
.file-info{max-width:850px;margin:5px auto;color:#c7b8ff;font-size:12px}
.hidden{display:none!important}
.empty{color:var(--muted);font-size:13px;padding:12px}

/* MOBILE */
@media(max-width:700px){
 .sidebar{
  position:fixed;top:0;bottom:0;left:-285px;
  transition:left .2s;width:270px
 }
 .sidebar.open{left:0}
 .topbar{padding:0 10px}
 .content{padding:20px 12px}
 .composer-area{padding:10px}
 .welcome h1{font-size:27px}
 .suggestions{grid-template-columns:1fr}
 .bubble{max-width:88%;font-size:14px}
 .mode{max-width:125px}
}
</style>
</head>

<body>
<div class="app">

<aside class="sidebar" id="sidebar">
 <div class="brand">DRIPSCALLION <span>AI</span></div>

 <button class="newchat" id="newChat">＋ New chat</button>
 <input class="search" id="search" placeholder="Search chats...">

 <div class="section-label">RECENT CONVERSATIONS</div>
 <div class="history" id="history"></div>

 <div class="side-footer">
  DRIPSCALLION AI STUDIO<br>
  <span>From Machakos to the World.</span>
 </div>
</aside>

<main class="main">
 <header class="topbar">
  <div class="top-left">
   <button class="icon-btn" id="sidebarBtn">☰</button>
   <div class="top-title">DRIPSCALLION AI</div>
  </div>
  <div class="top-right">
   <select class="mode" id="mode">
    <option value="general">General AI</option>
    <option value="study">Study Assistant</option>
    <option value="conversation">Conversation Helper</option>
   </select>
  </div>
 </header>

 <section class="content" id="content">
  <div class="welcome" id="welcome">
   <h1>What can I help you <span>with?</span></h1>
   <p>Your assistant for learning, creativity, ideas and everyday challenges.</p>

   <div class="suggestions">
    <button class="suggestion" data-mode="study"
     data-prompt="Teach me a difficult topic in simple language, step by step.">
     📚 <b>Learn anything</b><br>Understand a topic easily.
    </button>
    <button class="suggestion" data-mode="study"
     data-prompt="Create practice questions for me and explain their answers.">
     ✍️ <b>Practice questions</b><br>Test your understanding.
    </button>
    <button class="suggestion" data-mode="conversation"
     data-prompt="Help me start a natural and interesting conversation.">
     💬 <b>Conversation ideas</b><br>Find natural words to say.
    </button>
    <button class="suggestion" data-mode="general"
     data-prompt="Help me think through an idea and develop it step by step.">
     💡 <b>Explore an idea</b><br>Turn ideas into plans.
    </button>
   </div>
  </div>

  <div class="messages" id="messages"></div>
 </section>

 <section class="composer-area">
  <div class="composer">
   <button class="circle" id="attachBtn" title="Attach text file">＋</button>
   <textarea id="input" rows="1" placeholder="Message DRIPSCALLION AI..."></textarea>
   <button class="circle send" id="sendBtn" title="Send message">➤</button>
  </div>
  <div class="file-info hidden" id="fileInfo"></div>
  <div class="status" id="status"></div>
  <div class="note">DRIPSCALLION AI can make mistakes. Check important information.</div>
 </section>
</main>
</div>

<input type="file" id="fileInput" accept=".txt,.md,.csv,.json" hidden>

<script>
const $ = id => document.getElementById(id);

let chats = [];
let activeId = null;
let attachedText = "";
let attachedName = "";
let controller = null;
let lastUserPrompt = "";

try {
 chats = JSON.parse(localStorage.getItem("dripscallion_chats") || "[]");
 if(!Array.isArray(chats)) chats = [];
} catch(e){ chats = []; }

function save(){
 try{
  localStorage.setItem("dripscallion_chats",JSON.stringify(chats));
 }catch(e){
  $("status").textContent="Storage full. Delete some old conversations.";
 }
}

function activeChat(){
 return chats.find(c=>c.id===activeId);
}

function escapeHTML(s){
 return String(s).replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 }[c]));
}

function formatText(text){
 let s=escapeHTML(text);

 s=s.replace(/```([\s\S]*?)```/g,
  "<pre><code>$1</code></pre>");
 s=s.replace(/`([^`]+)`/g,"<code>$1</code>");
 s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
 s=s.replace(/\*([^*]+)\*/g,"<em>$1</em>");
 s=s.replace(/^### (.+)$/gm,"<strong>$1</strong>");
 s=s.replace(/^## (.+)$/gm,"<strong>$1</strong>");
 s=s.replace(/^# (.+)$/gm,"<strong>$1</strong>");
 s=s.replace(/^\s*[-*] (.+)$/gm,"• $1");
 s=s.replace(/\n/g,"<br>");
 return s;
}

function renderHistory(){
 const term=$("search").value.toLowerCase();
 $("history").innerHTML="";

 const filtered=chats.filter(c=>
  (c.title||"").toLowerCase().includes(term)
 );

 if(!filtered.length){
  $("history").innerHTML='<div class="empty">No conversations found.</div>';
  return;
 }

 filtered.forEach(chat=>{
  const row=document.createElement("div");
  row.className="chat-row"+(chat.id===activeId?" active":"");

  const open=document.createElement("button");
  open.className="chat-open";
  open.textContent=chat.title||"New chat";
  open.onclick=()=>openChat(chat.id);

  const options=document.createElement("button");
  options.className="chat-options";
  options.textContent="⋯";
  options.title="Conversation options";
  options.onclick=()=>chatOptions(chat.id);

  row.append(open,options);
  $("history").appendChild(row);
 });
}

function chatOptions(id){
 const chat=chats.find(c=>c.id===id);
 if(!chat)return;

 const action=prompt("Type R to rename or D to delete this conversation.");
 if(!action)return;

 if(action.toLowerCase()==="r"){
  const title=prompt("Enter a new chat name:",chat.title);
  if(title&&title.trim()){
   chat.title=title.trim();
   save();
   renderHistory();
  }
 }

 if(action.toLowerCase()==="d"){
  if(confirm("Delete this conversation permanently from this browser?")){
   chats=chats.filter(c=>c.id!==id);
   save();
   if(activeId===id)newChat();
   else renderHistory();
  }
 }
}

function createChat(){
 const chat={
  id:Date.now().toString()+Math.random().toString(36).slice(2,6),
  title:"New chat",
  messages:[],
  updated:Date.now()
 };
 chats.unshift(chat);
 activeId=chat.id;
 save();
 return chat;
}

function newChat(){
 activeId=null;
 $("messages").innerHTML="";
 $("welcome").classList.remove("hidden");
 $("input").value="";
 $("status").textContent="";
 clearAttachment();
 renderHistory();
 $("sidebar").classList.remove("open");
}

function openChat(id){
 const chat=chats.find(c=>c.id===id);
 if(!chat)return;

 activeId=id;
 $("messages").innerHTML="";
 $("welcome").classList.add("hidden");

 chat.messages.forEach(m=>renderMessage(m.role,m.text));
 renderHistory();
 $("content").scrollTop=$("content").scrollHeight;
 $("sidebar").classList.remove("open");
}

function renderMessage(role,text){
 $("welcome").classList.add("hidden");

 const row=document.createElement("div");
 row.className="message "+role;

 const avatar=document.createElement("div");
 avatar.className="avatar";
 avatar.textContent=role==="user"?"YOU":"DS";

 const bubble=document.createElement("div");
 bubble.className="bubble";
 bubble.innerHTML=formatText(text);

 if(role==="assistant"){
  const actions=document.createElement("div");
  actions.className="msg-actions";

  const copy=document.createElement("button");
  copy.textContent="Copy";
  copy.onclick=async()=>{
   try{
    await navigator.clipboard.writeText(text);
    copy.textContent="Copied!";
    setTimeout(()=>copy.textContent="Copy",1200);
   }catch(e){copy.textContent="Copy unavailable";}
  };

  const regenerate=document.createElement("button");
  regenerate.textContent="Regenerate";
  regenerate.onclick=regenerateAnswer;

  actions.append(copy,regenerate);
  bubble.appendChild(actions);
 }

 if(role==="user"){
  row.append(bubble,avatar);
 }else{
  row.append(avatar,bubble);
 }

 $("messages").appendChild(row);
 $("content").scrollTop=$("content").scrollHeight;
}

function addMessage(role,text){
 const chat=activeChat()||createChat();

 chat.messages.push({role,text});
 chat.updated=Date.now();

 if(role==="user"&&chat.title==="New chat"){
  chat.title=text.slice(0,38)+(text.length>38?"...":"");
 }
 save();
 renderMessage(role,text);
 renderHistory();
}

function modeInstruction(){
 const mode=$("mode").value;

 if(mode==="study"){
  return `You are DRIPSCALLION AI Study Assistant.
Teach all school and academic subjects worldwide.
Use simple language and explain difficult ideas step by step.
Use examples and show working for calculations.
When asked for practice, create questions at an appropriate level.
Give answers with explanations.
Be encouraging, accurate and clear.`;
 }

 if(mode==="conversation"){
  return `You are DRIPSCALLION AI Conversation Helper.
Help people write natural, realistic messages.
Support English, Kiswahili and Sheng.
Help with greetings, friendships, everyday conversations and age-appropriate relationships.
Avoid robotic, cheesy, exaggerated or overly romantic lines.
Match the user's requested tone.
Respect boundaries and consent.
Keep suggested messages natural and concise.`;
 }

 return `You are DRIPSCALLION AI, a capable and natural conversational assistant.
Respond naturally, like a helpful person.
Understand context and the user's actual question.
Mirror the language used by the user, including English, Kiswahili and Sheng.
Keep simple answers short.
Explain difficult topics clearly.
Use headings, lists, examples and code only when useful.
Do not repeat the question unnecessarily.
Do not invent facts or claim tools are available when they are not.
Be friendly, thoughtful and direct.`;
}

function conversationContext(chat){
 return chat.messages.slice(-12).map(m=>
  (m.role==="user"?"User: ":"Assistant: ")+m.text
 ).join("\n\n");
}

async function requestAI(prompt,regenerate=false){
 const chat=activeChat();
 if(!chat)return;

 $("sendBtn").disabled=true;
 $("status").textContent="DRIPSCALLION AI is thinking...";

 const typing=document.createElement("div");
 typing.className="typing";
 typing.id="typing";
 typing.textContent="DRIPSCALLION AI is thinking...";
 $("messages").appendChild(typing);

 const context=conversationContext(chat);

 const fullPrompt=
 modeInstruction()+
 "\n\nConversation so far:\n"+context+
 "\n\nRespond to the latest user message. Remember the conversation.";

 controller=new AbortController();

 try{
  const response=await fetch("/api/chat",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({message:fullPrompt}),
   signal:controller.signal
  });

  if(!response.ok)throw new Error("Server returned "+response.status);

  const data=await response.json();
  const answer=data.response||data.text||data.result;

  if(!answer)throw new Error("Empty AI response.");

  $("typing")?.remove();
  addMessage("assistant",answer);
  $("status").textContent="";

 }catch(error){
  $("typing")?.remove();

  if(error.name==="AbortError"){
   $("status").textContent="Generation stopped.";
  }else{
   $("status").textContent="Connection problem. Please try again.";
   addMessage("assistant","I couldn't connect just now. Please check your internet and try again.");
  }
 }finally{
  controller=null;
  $("sendBtn").disabled=false;
 }
}

async function sendMessage(){
 if(controller){
  controller.abort();
  return;
 }

 let value=$("input").value.trim();
 if(!value&&!attachedText)return;

 if(attachedText){
  value+="\n\nAttached text file ("+attachedName+"):\n"+attachedText;
 }

 if(!activeChat())createChat();

 lastUserPrompt=value;
 addMessage("user",value);

 $("input").value="";
 $("input").style.height="auto";

 clearAttachment();
 await requestAI(value);
}

async function regenerateAnswer(){
 const chat=activeChat();
 if(!chat||controller)return;

 const lastUser=[...chat.messages].reverse().find(m=>m.role==="user");
 if(!lastUser)return;

 if(chat.messages.length&&chat.messages[chat.messages.length-1].role==="assistant"){
  chat.messages.pop();
  save();
  openChat(chat.id);
 }

 await requestAI(lastUser.text,true);
}

function clearAttachment(){
 attachedText="";
 attachedName="";
 $("fileInfo").textContent="";
 $("fileInfo").classList.add("hidden");
}

$("newChat").onclick=newChat;

$("sidebarBtn").onclick=()=>
 $("sidebar").classList.toggle("open");

$("search").oninput=renderHistory;

$("sendBtn").onclick=sendMessage;

$("input").addEventListener("keydown",e=>{
 if(e.key==="Enter"&&!e.shiftKey){
  e.preventDefault();
  sendMessage();
 }
});

$("input").addEventListener("input",()=>{
 $("input").style.height="auto";
 $("input").style.height=Math.min($("input").scrollHeight,160)+"px";
});

$("attachBtn").onclick=()=>$("fileInput").click();

$("fileInput").onchange=async e=>{
 const file=e.target.files[0];
 if(!file)return;

 if(file.size>100000){
  $("status").textContent="Text files must be smaller than 100 KB.";
  e.target.value="";
  return;
 }

 try{
  attachedText=await file.text();
  attachedName=file.name;
  $("fileInfo").textContent="📎 "+attachedName+" (click + to replace)";
  $("fileInfo").classList.remove("hidden");
  $("status").textContent="File ready. Send your message to include it.";
 }catch(err){
  $("status").textContent="Could not read this file.";
 }
 e.target.value="";
};

document.querySelectorAll(".suggestion").forEach(btn=>{
 btn.onclick=()=>{
  $("mode").value=btn.dataset.mode;
  $("input").value=btn.dataset.prompt;
  $("input").focus();
 };
});

renderHistory();

if(chats.length){
 const latest=[...chats].sort((a,b)=>b.updated-a.updated)[0];
 openChat(latest.id);
}else{
 newChat();
}
</script>
</body>
</html>
