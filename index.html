
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRIPSCALLION AI STUDIO</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080b12;color:#f4f4f5;
 font-family:Arial,sans-serif;height:100vh;overflow:hidden
}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{display:flex;height:100vh;width:100%}
.sidebar{
 width:270px;background:#10131b;border-right:1px solid #252a36;
 display:flex;flex-direction:column;padding:14px;flex-shrink:0
}
.brand{font-size:19px;font-weight:bold;padding:12px 5px 20px;color:#fff}
.brand span{color:#a78bfa}
.newchat{
 background:#27223b;color:white;border:1px solid #514477;
 padding:12px;border-radius:10px;text-align:left;margin-bottom:12px
}
.search{width:100%;background:#191d28;color:white;border:1px solid #303545;
 padding:11px;border-radius:9px;outline:none;margin-bottom:12px}
.history-title{font-size:12px;color:#9297a6;padding:8px 4px}
.history{overflow-y:auto;min-height:0;flex:1}
.chat-item{
 padding:11px 10px;border-radius:8px;margin-bottom:4px;
 cursor:pointer;color:#d5d6df;font-size:14px;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.chat-item:hover,.chat-item.active{background:#252838}
.sidebar-bottom{border-top:1px solid #292d39;padding-top:12px}
.profile{font-size:13px;color:#aaa;padding:8px 4px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh}
.topbar{
 height:60px;border-bottom:1px solid #242936;display:flex;
 align-items:center;justify-content:space-between;padding:0 20px;flex-shrink:0
}
.topbar-title{font-weight:bold}
.top-actions{display:flex;gap:8px;align-items:center}
.small-btn{
 background:#191d28;color:#ddd;border:1px solid #303545;
 border-radius:8px;padding:8px 11px
}
.mode-select{
 background:#191d28;color:white;border:1px solid #303545;
 border-radius:8px;padding:8px;max-width:145px
}
.content{flex:1;overflow-y:auto;padding:25px 18px}
.welcome{max-width:760px;margin:9vh auto 0;text-align:center}
.welcome h1{font-size:35px;margin-bottom:8px}
.welcome h1 span{color:#a78bfa}
.welcome p{color:#a5a9b7;line-height:1.6}
.quick-actions{
 display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:28px
}
.quick-actions button{
 background:#171b27;color:#ddd;border:1px solid #303545;
 padding:12px 15px;border-radius:12px
}
.messages{max-width:820px;margin:auto;display:flex;flex-direction:column;gap:20px}
.message{display:flex;gap:12px;align-items:flex-start;line-height:1.65}
.avatar{
 width:32px;height:32px;border-radius:50%;background:#29243d;
 display:flex;align-items:center;justify-content:center;flex-shrink:0;
 font-size:12px;font-weight:bold
}
.message.user .avatar{background:#343b4b}
.bubble{white-space:pre-wrap;overflow-wrap:anywhere;max-width:100%}
.message-actions{margin-top:8px;display:flex;gap:8px}
.message-actions button{
 background:transparent;color:#9ca3b5;border:1px solid #343949;
 padding:5px 9px;border-radius:7px;font-size:12px
}
.composer-area{
 padding:12px 18px 17px;border-top:1px solid #242936;flex-shrink:0
}
.composer-wrap{
 max-width:820px;margin:auto;background:#171b26;border:1px solid #34394a;
 border-radius:17px;padding:10px;display:flex;align-items:flex-end;gap:8px
}
.composer-wrap textarea{
 flex:1;resize:none;min-height:28px;max-height:150px;
 background:transparent;border:0;outline:none;color:white;
 padding:9px 4px;line-height:1.5
}
.round-btn{
 width:38px;height:38px;border-radius:50%;border:0;
 background:#292e3d;color:white;flex-shrink:0
}
.send-btn{background:#a78bfa;color:#100d18;font-weight:bold}
.send-btn:disabled{opacity:.4;cursor:not-allowed}
.composer-note{text-align:center;color:#73798a;font-size:11px;margin-top:9px}
.menu-wrap{position:relative}
.popup{
 display:none;position:absolute;bottom:48px;left:0;width:210px;
 background:#202432;border:1px solid #3a4052;border-radius:12px;
 padding:7px;z-index:10;box-shadow:0 10px 30px #0008
}
.popup.show{display:block}
.popup button{
 display:block;width:100%;text-align:left;background:transparent;
 color:#eee;border:0;padding:11px;border-radius:8px
}
.popup button:hover{background:#34394b}
.status{font-size:12px;color:#a78bfa;padding:5px 0}
.file-chip{font-size:12px;color:#c4b5fd;padding:5px}
.hidden{display:none!important}
@media(max-width:700px){
 .sidebar{position:fixed;z-index:20;left:-280px;top:0;bottom:0;transition:.2s}
 .sidebar.open{left:0}
 .topbar{padding:0 10px}
 .content{padding:18px 12px}
 .composer-area{padding:10px}
 .welcome h1{font-size:27px}
 .mode-select{max-width:115px}
}
</style>
</head>

<body>
<div class="app">

<aside class="sidebar" id="sidebar">
 <div class="brand">DRIPSCALLION <span>AI</span></div>
 <button class="newchat" id="newChatBtn">＋ New chat</button>
 <input class="search" id="searchChats" placeholder="Search conversations...">
 <div class="history-title">YOUR CHATS</div>
 <div class="history" id="history"></div>
 <div class="sidebar-bottom">
  <div class="profile">DRIPSCALLION AI STUDIO</div>
 </div>
</aside>

<main class="main">
 <header class="topbar">
  <div class="top-actions">
   <button class="small-btn" id="menuSidebar" aria-label="Open menu">☰</button>
   <div class="topbar-title">AI Studio</div>
  </div>
  <div class="top-actions">
   <select class="mode-select" id="mode">
    <option value="general">General AI</option>
    <option value="study">Study Assistant</option>
    <option value="conversation">Conversation Helper</option>
   </select>
  </div>
 </header>

 <section class="content" id="content">
  <div class="welcome" id="welcome">
   <h1>Welcome to <span>DRIPSCALLION AI</span></h1>
   <p>Your AI assistant for learning, creativity, ideas and everyday life.</p>
   <div class="quick-actions">
    <button data-prompt="Teach me a topic step by step in simple language.">📚 Learn something</button>
    <button data-prompt="Give me practice questions on a topic and explain the answers.">✍️ Practice questions</button>
    <button data-prompt="Help me start a natural, funny conversation without sounding robotic or too romantic.">💬 Conversation ideas</button>
    <button data-prompt="Help me understand and solve this problem step by step.">🧠 Solve a problem</button>
   </div>
  </div>
  <div class="messages" id="messages"></div>
 </section>

 <section class="composer-area">
  <div class="composer-wrap">
   <div class="menu-wrap">
    <button class="round-btn" id="plusBtn" title="Attachments">＋</button>
    <div class="popup" id="plusMenu">
     <button id="attachText">📄 Attach a text file</button>
     <button id="clearFile">✕ Remove attachment</button>
    </div>
   </div>
   <textarea id="messageInput" rows="1" placeholder="Message DRIPSCALLION AI..."></textarea>
   <button class="round-btn" id="micBtn" title="Speak">🎤</button>
   <button class="round-btn send-btn" id="sendBtn" title="Send">➤</button>
  </div>
  <div class="file-chip hidden" id="fileChip"></div>
  <div class="status" id="status"></div>
  <div class="composer-note">AI can make mistakes. Check important information.</div>
 </section>
</main>
</div>

<input type="file" id="fileInput" accept=".txt,.md,.csv,.json" class="hidden">

<script>
const $ = id => document.getElementById(id);

let chats = [];
let currentChatId = null;
let attachedText = "";
let attachedName = "";
let recognition = null;

try {
 chats = JSON.parse(localStorage.getItem("dripscallion_chats") || "[]");
 if (!Array.isArray(chats)) chats = [];
} catch(e){ chats = []; }

function saveChats(){
 try {
  localStorage.setItem("dripscallion_chats", JSON.stringify(chats));
 } catch(e) {
  $("status").textContent = "Browser storage is full. Delete some old chats.";
 }
}

function currentChat(){
 return chats.find(c => c.id === currentChatId);
}

function newChat(){
 currentChatId = null;
 $("messages").innerHTML = "";
 $("welcome").classList.remove("hidden");
 $("messageInput").value = "";
 attachedText = "";
 attachedName = "";
 updateFileChip();
 renderHistory();
 $("sidebar").classList.remove("open");
}

function createChat(){
 const chat = {
  id: Date.now().toString(),
  title: "New conversation",
  messages: [],
  updated: Date.now()
 };
 chats.unshift(chat);
 currentChatId = chat.id;
 saveChats();
 return chat;
}

function renderHistory(){
 const term = $("searchChats").value.toLowerCase();
 $("history").innerHTML = "";

 chats.filter(c => c.title.toLowerCase().includes(term))
 .forEach(chat => {
  const item = document.createElement("div");
  item.className = "chat-item" + (chat.id === currentChatId ? " active" : "");
  item.textContent = chat.title;
  item.title = "Click to open. Right-click for options.";
  item.onclick = () => openChat(chat.id);
  item.oncontextmenu = e => {
   e.preventDefault();
   const action = prompt("Type R to rename or D to delete this chat.");
   if(action && action.toLowerCase() === "r"){
    const name = prompt("New conversation name:", chat.title);
    if(name && name.trim()){
     chat.title = name.trim();
     saveChats();
     renderHistory();
    }
   } else if(action && action.toLowerCase() === "d"){
    if(confirm("Delete this conversation?")){
     chats = chats.filter(c => c.id !== chat.id);
     saveChats();
     if(currentChatId === chat.id) newChat();
     else renderHistory();
    }
   }
  };
  $("history").appendChild(item);
 });
}

function openChat(id){
 const chat = chats.find(c => c.id === id);
 if(!chat) return;
 currentChatId = id;
 $("messages").innerHTML = "";
 $("welcome").classList.add("hidden");
 chat.messages.forEach(m => renderMessage(m.role, m.text, false));
 renderHistory();
 $("sidebar").classList.remove("open");
 $("content").scrollTop = $("content").scrollHeight;
}

function renderMessage(role, text, addActions=true){
 $("welcome").classList.add("hidden");
 const row = document.createElement("div");
 row.className = "message " + role;

 const avatar = document.createElement("div");
 avatar.className = "avatar";
 avatar.textContent = role === "user" ? "YOU" : "DS";

 const body = document.createElement("div");
 body.className = "bubble";
 const textNode = document.createElement("div");
 textNode.textContent = text;
 body.appendChild(textNode);

 if(role === "assistant" && addActions){
  const actions = document.createElement("div");
  actions.className = "message-actions";
  const speak = document.createElement("button");
  speak.textContent = "🔊 Read aloud";
  speak.onclick = () => speakText(text);
  actions.appendChild(speak);
  body.appendChild(actions);
 }

 row.appendChild(avatar);
 row.appendChild(body);
 $("messages").appendChild(row);
 $("content").scrollTop = $("content").scrollHeight;
}

function addMessage(role, text){
 const chat = currentChat() || createChat();
 chat.messages.push({role,text});
 chat.updated = Date.now();

 if(chat.title === "New conversation" && role === "user"){
  chat.title = text.slice(0,38) + (text.length > 38 ? "..." : "");
 }
 saveChats();
 renderMessage(role,text);
 renderHistory();
}

function getModeInstruction(){
 const mode = $("mode").value;

 if(mode === "study"){
  return "You are DRIPSCALLION AI Study Assistant. Help learners across school subjects and educational levels worldwide. Explain in very simple, clear language, define difficult words, use examples, and show calculations step by step. Ask what level or curriculum they follow only when necessary. When asked for practice, create questions at suitable difficulty and provide answers with explanations. Never pretend to know an official syllabus if unsure. Be concise but complete. ";
 }

 if(mode === "conversation"){
  return "You are DRIPSCALLION AI Conversation Helper. Help people write natural, respectful messages for everyday conversations, friendships and age-appropriate relationships. Give short, realistic lines in English, Swahili or Sheng as requested. Avoid robotic, exaggerated, overly romantic or cheesy language. Match the situation and tone. Respect boundaries and consent. Give a few useful alternatives only when helpful. ";
 }

 return "You are DRIPSCALLION AI, a helpful, natural and capable assistant. Answer in the language the user uses. Be clear, friendly and direct. Keep simple answers short. Explain complicated topics clearly without unnecessary long descriptions. Do not invent facts or capabilities. ";
}

async function sendMessage(){
 const input = $("messageInput");
 let value = input.value.trim();
 if(!value) return;

 if(attachedText){
  value += "\n\nAttached file (" + attachedName + "):\n" + attachedText;
 }

 const chat = currentChat() || createChat();
 addMessage("user", input.value.trim() + (attachedName ? "\n📎 " + attachedName : ""));
 input.value = "";
 input.style.height = "auto";
 attachedText = "";
 attachedName = "";
 updateFileChip();

 $("sendBtn").disabled = true;
 $("status").textContent = "DRIPSCALLION AI is thinking...";

 const recent = chat.messages.slice(-8).map(m =>
  (m.role === "user" ? "User: " : "Assistant: ") + m.text
 ).join("\n\n");

 const fullPrompt = getModeInstruction() +
  "\nUse this recent conversation for context:\n" + recent +
  "\n\nRespond to the latest user message.";

 try{
  const response = await fetch("/api/chat",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({message:fullPrompt})
  });

  if(!response.ok) throw new Error("Server error: " + response.status);

  const data = await response.json();
  const answer = data.response || data.text || data.result;

  if(!answer) throw new Error("The AI returned an empty response.");

  addMessage("assistant", answer);
  $("status").textContent = "";
 }catch(error){
  addMessage("assistant","I couldn't connect just now. Please check your internet connection and try again.");
  $("status").textContent = "Connection problem: " + error.message;
 }finally{
  $("sendBtn").disabled = false;
  input.focus();
 }
}

function speakText(text){
 if(!("speechSynthesis" in window)){
  $("status").textContent = "Voice reading is not supported in this browser.";
  return;
 }
 speechSynthesis.cancel();
 const utterance = new SpeechSynthesisUtterance(text);
 utterance.lang = "en-US";
 utterance.rate = 1;
 speechSynthesis.speak(utterance);
}

function startMic(){
 const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

 if(!SpeechRecognition){
  $("status").textContent = "Voice typing is not supported here. Try Chrome or Edge.";
  return;
 }

 if(recognition){
  recognition.stop();
  recognition = null;
  $("micBtn").textContent = "🎤";
  return;
 }

 recognition = new SpeechRecognition();
 recognition.lang = "en-US";
 recognition.interimResults = true;
 recognition.continuous = false;

 $("micBtn").textContent = "⏹";
 $("status").textContent = "Listening... Speak now.";

 recognition.onresult = event => {
  let transcript = "";
  for(let i=0;i<event.results.length;i++){
   transcript += event.results[i][0].transcript;
  }
  $("messageInput").value = transcript;
  $("messageInput").dispatchEvent(new Event("input"));
 };

 recognition.onerror = event => {
  $("status").textContent = "Microphone issue: " + event.error;
 };

 recognition.onend = () => {
  recognition = null;
  $("micBtn").textContent = "🎤";
  if($("status").textContent === "Listening... Speak now."){
   $("status").textContent = "";
  }
 };

 recognition.start();
}

function updateFileChip(){
 const chip = $("fileChip");
 if(attachedName){
  chip.textContent = "📎 " + attachedName;
  chip.classList.remove("hidden");
 }else{
  chip.textContent = "";
  chip.classList.add("hidden");
 }
}

$("newChatBtn").onclick = newChat;
$("sendBtn").onclick = sendMessage;
$("micBtn").onclick = startMic;
$("menuSidebar").onclick = () => $("sidebar").classList.toggle("open");

$("messageInput").addEventListener("keydown",e=>{
 if(e.key === "Enter" && !e.shiftKey){
  e.preventDefault();
  sendMessage();
 }
});

$("messageInput").addEventListener("input",()=>{
 $("messageInput").style.height = "auto";
 $("messageInput").style.height =
  Math.min($("messageInput").scrollHeight,150) + "px";
});

$("searchChats").addEventListener("input",renderHistory);

$("plusBtn").onclick = () => $("plusMenu").classList.toggle("show");

$("attachText").onclick = () => {
 $("plusMenu").classList.remove("show");
 $("fileInput").click();
};

$("clearFile").onclick = () => {
 attachedText = "";
 attachedName = "";
 updateFileChip();
 $("plusMenu").classList.remove("show");
};

$("fileInput").onchange = async e => {
 const file = e.target.files[0];
 if(!file) return;

 if(file.size > 100000){
  $("status").textContent = "Please choose a text file smaller than 100 KB.";
  return;
 }

 try{
  attachedText = await file.text();
  attachedName = file.name;
  updateFileChip();
  $("status").textContent = "Text file attached. Its contents will be sent with your message.";
 }catch(error){
  $("status").textContent = "Could not read this file.";
 }
 e.target.value = "";
};

document.querySelectorAll("[data-prompt]").forEach(button=>{
 button.onclick = () => {
  const prompt = button.getAttribute("data-prompt");
  if(prompt.includes("conversation")) $("mode").value = "conversation";
  else if(prompt.includes("topic") || prompt.includes("questions") || prompt.includes("problem")) $("mode").value = "study";
  $("messageInput").value = prompt;
  $("messageInput").focus();
 };
});

renderHistory();
if(chats.length){
 openChat(chats[0].id);
}else{
 newChat();
}
</script>
</body>
</html>
